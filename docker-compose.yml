version: '3.8'

services:
  ai-travel-butler:
    build: .
    image: ai-travel-butler:latest
    container_name: ai-travel-butler
    ports:
      - "3000:3000"  # 前端
      - "8787:8787"  # 后端 API
    environment:
      # AI Provider API Keys（必填）
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # 可选：自定义后端地址
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8787}
      # 可选：天地图 API Key
      - TDT_API_KEY=${TDT_API_KEY:-97f9870fb795ba80ef201d6edae71d73}
    volumes:
      # 持久化历史记录
      - travel-history:/app/.data
    restart: unless-stopped

volumes:
  travel-history: