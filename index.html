
<!doctype html>
<html>
  <head>
    <title>AI 深度旅游行程规划专家</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/index.css" />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
          "@googlemaps/markerclusterer": "https://esm.sh/@googlemaps/markerclusterer@^2.5.3"
        }
      }
    </script>
  </head>
  <body>
    <div id="map-container" class="map-container">
      <div id="map"></div>

      <button id="toggle-search-ui" class="floating-control-btn toggle-ui-btn" title="显示/隐藏搜索栏">
        <i class="fas fa-eye-slash"></i>
      </button>

      <button id="reopen-timeline" class="floating-control-btn reopen-timeline-btn hidden" title="查看完整行程">
        <i class="fas fa-route"></i>
      </button>

      <div class="search-container" id="search-container">
        <div class="search-header-group">
          <div class="header-left-controls">
            <div class="mode-toggle">
              <label class="switch">
                <input type="checkbox" id="planner-mode-toggle" />
                <span class="slider round"></span>
              </label>
              <span class="mode-label" id="mode-text">景点发现模式</span>
            </div>

            <select id="model-selector" class="model-select" title="切换 AI 模型">
              <optgroup label="Google Gemini">
                <option value="gemini-3-pro-preview">🧠 Gemini 3 Pro (推荐)</option>
                <option value="gemini-3-flash-preview">⚡ Gemini 3 Flash</option>
              </optgroup>
              <optgroup label="DeepSeek (需配置 Key)">
                <option value="deepseek-chat">🐳 DeepSeek V3 (强力)</option>
                <option value="deepseek-reasoner">🧠 DeepSeek R1 (深度思考)</option>
              </optgroup>
            </select>
            
            <button id="open-settings" class="icon-btn-small" title="配置 API Keys">
              <i class="fas fa-cog"></i>
            </button>
          </div>

          <div id="preference-toggle-group" class="preference-group hidden">
            <select id="route-preference" class="model-select">
              <option value="budget">💰 经济性价比模式</option>
              <option value="flexible">🕊️ 时间宽松深度游</option>
            </select>
          </div>
        </div>

        <div class="search-bar-stack">
          <div class="search-bar">
            <i class="fas fa-search-location" style="color: #ff5722; margin-right: 12px; font-size: 1.2rem;"></i>
            <textarea id="prompt-input" placeholder="输入目的地或行程想法..."></textarea>
            <button id="generate" class="search-button"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>

        <div class="error hidden" id="error-message"></div>
      </div>

      <div id="card-carousel" class="card-carousel hidden">
        <div class="card-container" id="card-container"></div>
        <div class="carousel-indicators" id="carousel-indicators"></div>
      </div>

      <button id="reset" class="floating-control-btn reset-button" title="重置地图 (R)">
        <i class="fas fa-redo-alt"></i>
      </button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-key"></i> 模型配置</h3>
          <button id="close-settings" class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p class="settings-hint">Google Gemini 模型已预置 API Key。如需使用 DeepSeek，请在下方填入您的 API Key。</p>
          <div class="input-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="deepseek-key-input" placeholder="sk-...">
          </div>
          <button id="save-settings" class="primary-btn">保存配置</button>
        </div>
      </div>
    </div>

    <div class="timeline-container" id="timeline-container">
      <div class="timeline-header">
        <div class="header-left">
          <h3 id="timeline-title">深度行程指南</h3>
        </div>
        <div class="header-actions">
          <button id="export-btn" class="icon-btn" title="导出为 Markdown"><i class="fas fa-file-export"></i></button>
          <button id="close-timeline" class="close-button"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
      <div id="grounding-sources" class="grounding-sources hidden">
        <h4>参考资料与来源</h4>
        <ul id="source-list"></ul>
      </div>
    </div>

    <div id="spinner" class="hidden spinner">
      <div class="loading-text">AI 正在根据您的偏好，联网检索并规划完整行程...</div>
      <div id="spinner-model-info" class="loading-model-name"></div>
    </div>

    <script>
      ((g) => {
        var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window;
        b = b[c] || (b[c] = {});
        var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(), u = () => h || (h = new Promise(async (f, n) => {
          await (a = m.createElement("script")); e.set("libraries", [...r] + "");
          for (k in g) e.set(k.replace(/[A-Z]/g, (t) => "_" + t[0].toLowerCase()), g[k]);
          e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
          d[q] = f; a.onerror = () => (h = n(Error(p + " could not load.")));
          a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a);
        }));
        d[l] ? console.warn(p + " only loads once. Ignoring:", g) : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
      })({ key: "AIzaSyCNXwnZayI7hxvA3huOB9d82myo1L-7j9Y", v: "weekly" });
    </script>
  </body>
</html>
