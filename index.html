
<!doctype html>
<html>
  <head>
    <title>AI Travel Pro - 深度智游</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/index.css" />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
          "leaflet": "https://esm.sh/leaflet@1.9.4"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <!-- HUD 控制中心 -->
      <div class="hud-controls">
        <button id="hud-toggle-input" class="hud-btn active" title="开启灵感搜寻"><i class="fas fa-magic"></i></button>
        <button id="hud-toggle-itinerary" class="hud-btn" title="查看排期方案"><i class="fas fa-calendar-alt"></i></button>
        <button id="hud-toggle-layers" class="hud-btn" title="切换视图底图"><i class="fas fa-layer-group"></i></button>
        <button id="hud-open-history" class="hud-btn" title="历史方案库"><i class="fas fa-archive"></i></button>
        <button id="hud-open-settings" class="hud-btn" title="深度引擎设置"><i class="fas fa-sliders-h"></i></button>
      </div>

      <!-- 地图底座 -->
      <main class="main-canvas">
        <div id="map"></div>
      </main>

      <!-- 左侧主控制台 -->
      <aside class="sidebar-left" id="sidebar-left">
        <div class="sidebar-header">
          <div class="brand"><i class="fas fa-compass"></i><span>Travel Pro</span></div>
          <button id="close-console" style="background:none; border:none; color:var(--text-body); cursor:pointer; font-size:18px; padding:10px;"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-scroll">
          <div class="settings-group">
            <label>AI 决策引擎</label>
            <select id="model-selector">
              <optgroup label="Google">
                <option value="gemini-3-pro-preview">🧠 Gemini 3 Pro</option>
                <option value="gemini-3-flash-preview">⚡ Gemini 3 Flash</option>
              </optgroup>
              <optgroup label="DeepSeek">
                <option value="deepseek-chat">🐳 DeepSeek V3</option>
              </optgroup>
              <optgroup label="智谱 AI">
                <option value="glm-4-plus">💎 GLM-4-Plus</option>
                <option value="glm-4-flash">⚡ GLM-4-Flash</option>
              </optgroup>
            </select>
          </div>

          <div class="settings-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <label>您的旅行灵感</label>
              <div style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;">
                <span id="mode-label-text" style="opacity:0.7;">景点发现模式</span>
                <label class="switch"><input type="checkbox" id="planner-mode-toggle"><span class="slider"></span></label>
              </div>
            </div>
            
            <div id="preference-toggle-group" class="hidden" style="margin-bottom:15px; animation: slideDown 0.3s ease-out;">
              <select id="route-preference" style="font-size:13px; padding:10px; border-radius:10px;">
                <option value="balanced">⚖️ 平衡路径规划</option>
                <option value="fastest">🚀 极速特种兵模式</option>
                <option value="scenic">🖼️ 深度美景环线</option>
              </select>
            </div>

            <div class="prompt-box-v3">
              <textarea id="prompt-input" placeholder="输入想法，如：我想去成都玩3天，必须吃最地道的火锅..."></textarea>
              <div class="action-bar">
                <button id="generate" class="btn-generate">
                  <span>生成深度排期</span><i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>
          
          <div id="error-message" class="hidden" style="margin-top:20px; padding:20px; background:#fff1f2; border-radius:20px; color:#e11d48; font-size:14px; border:1px solid #ffe4e6;">
            <i class="fas fa-shield-virus" style="margin-right:10px;"></i><span id="error-text"></span>
          </div>
        </div>
      </aside>

      <!-- 右侧行程抽屉 -->
      <aside class="sidebar-right" id="timeline-container">
        <div class="sidebar-header">
          <h3 style="font-weight:900; color:var(--text-title);">AI 深度方案</h3>
          <div style="display:flex; gap:8px;">
            <button id="save-itinerary-btn" class="hud-btn small-hud" title="保存到我的历史"><i class="fas fa-save"></i></button>
            <button id="export-file-btn" class="hud-btn small-hud" title="导出为文本文件"><i class="fas fa-file-download"></i></button>
            <button id="share-btn" class="hud-btn small-hud" title="复制指南内容"><i class="fas fa-copy"></i></button>
            <button id="close-itinerary" class="hud-btn small-hud"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="sidebar-scroll" id="timeline-content"></div>
      </aside>

      <!-- 设置模态框 -->
      <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
          <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
            <h3 style="font-size:1.6rem; font-weight:900;"><i class="fas fa-key" style="color:var(--primary); margin-right:14px;"></i>API 接入中心</h3>
            <button id="close-settings" style="background:none; border:none; cursor:pointer; font-size:28px; opacity:0.3;">&times;</button>
          </div>
          <div class="settings-group">
            <label>智谱 AI API Key</label>
            <input type="password" id="zhipu-key-input" placeholder="输入智谱 API Key...">
          </div>
          <div class="settings-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="deepseek-key-input" placeholder="sk-...">
          </div>
          <div class="settings-group">
            <label>天地图 tk</label>
            <input type="text" id="tdt-key-input" placeholder="地图渲染秘钥...">
          </div>
          <button id="save-settings" class="btn-generate" style="width:100%; justify-content:center;">保存并同步</button>
        </div>
      </div>

      <!-- 历史模态框 -->
      <div id="history-modal" class="modal-overlay">
        <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
          <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3 style="font-weight:900; font-size: 1.5rem;">过往方案库</h3>
            <button id="close-history" style="background:none; border:none; cursor:pointer; font-size:28px; opacity:0.3;">&times;</button>
          </div>
          <div id="history-list" style="overflow-y: auto; flex-grow: 1;"></div>
        </div>
      </div>

      <!-- 全局加载器 -->
      <div id="spinner" class="spinner-v2">
        <div class="loader"></div>
        <div style="margin-top:32px; font-weight:900; font-size:1.4rem;">AI 专家正在深度推演...</div>
      </div>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
