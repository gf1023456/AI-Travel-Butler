
<!doctype html>
<html>
  <head>
    <title>AI 深度旅游规划专家 - Pro</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="/index.css" />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
          "leaflet": "https://esm.sh/leaflet@1.9.4",
          "leaflet.markercluster": "https://esm.sh/leaflet.markercluster@1.5.3"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Left Sidebar -->
      <aside class="sidebar-left" id="sidebar-left">
        <div class="sidebar-header">
          <div class="brand">
            <i class="fas fa-route"></i>
            <span>AI Travel Pro</span>
          </div>
          <div class="header-actions" style="display:flex; gap:8px;">
            <button id="open-history" class="icon-btn" title="历史行程">
              <i class="fas fa-history"></i>
            </button>
            <button id="open-settings" class="icon-btn" title="配置中心">
              <i class="fas fa-cog"></i>
            </button>
          </div>
        </div>

        <div class="sidebar-scroll">
          <section class="control-section">
            <label class="section-label">智能模型</label>
            <select id="model-selector" class="form-select">
              <optgroup label="Google Gemini">
                <option value="gemini-3-pro-preview">🧠 Gemini 3 Pro (推荐)</option>
                <option value="gemini-3-flash-preview">⚡ Gemini 3 Flash</option>
              </optgroup>
              <optgroup label="DeepSeek">
                <option value="deepseek-chat">🐳 DeepSeek V3</option>
                <option value="deepseek-reasoner">🧠 DeepSeek R1</option>
              </optgroup>
              <optgroup label="智谱 AI (BigModel)">
                <option value="glm-4-plus">💎 GLM-4-Plus (最强)</option>
                <option value="glm-4-flash">⚡ GLM-4-Flash (极速)</option>
              </optgroup>
            </select>
          </section>

          <section class="control-section">
            <label class="section-label">工作模式</label>
            <div class="mode-control-card">
              <div class="mode-toggle-group">
                <span class="mode-text" id="mode-text">景点发现模式</span>
                <label class="switch">
                  <input type="checkbox" id="planner-mode-toggle" />
                  <span class="slider round"></span>
                </label>
              </div>
            </div>
          </section>

          <section class="control-section hidden" id="preference-toggle-group">
            <label class="section-label">路径偏好</label>
            <select id="route-preference" class="form-select">
              <option value="budget">💰 经济性价比模式</option>
              <option value="flexible">🕊️ 时间宽松深度游</option>
            </select>
          </section>

          <section class="input-section">
            <label class="section-label">您的旅行想法</label>
            <div class="prompt-box">
              <textarea id="prompt-input" placeholder="例如：我想去北京玩三天，带孩子，住在王府井附近..."></textarea>
              <button id="generate" class="primary-action-btn">
                <span>开始规划</span>
                <i class="fas fa-magic"></i>
              </button>
            </div>
          </section>

          <div id="error-message" class="error-box hidden" style="margin-top: 15px; padding: 12px; background: #fee2e2; border-radius: 8px; color: #b91c1c; font-size: 13px;"></div>
        </div>

        <div class="sidebar-footer">
          <button id="reset" class="footer-btn">
            <i class="fas fa-redo-alt"></i>
            <span>重置地图</span>
          </button>
        </div>
      </aside>

      <!-- Main Map Area -->
      <main class="main-canvas">
        <div id="map"></div>

        <div class="map-tool-stack">
          <button id="toggle-timeline" class="map-tool-btn" title="查看行程清单">
            <i class="fas fa-list-ul"></i>
          </button>
          <div class="map-type-menu-wrapper">
            <button id="toggle-map-type" class="map-tool-btn" title="切换图层">
              <i class="fas fa-layer-group"></i>
            </button>
            <div id="map-type-menu" class="map-type-menu hidden">
              <div class="menu-label">天地图图层</div>
              <button class="menu-item active" data-type="tdt_vec">天地图 矢量</button>
              <button class="menu-item" data-type="tdt_img">天地图 影像</button>
            </div>
          </div>
          <button id="toggle-search-ui" class="map-tool-btn" title="全屏浏览">
            <i class="fas fa-expand"></i>
          </button>
        </div>

        <!-- Carousel -->
        <div id="card-carousel" class="card-carousel hidden">
          <div class="card-container" id="card-container"></div>
        </div>
      </main>

      <!-- Right Panel: Timeline -->
      <aside class="sidebar-right" id="timeline-container">
        <div class="sidebar-header">
          <h3 id="timeline-title">深度行程指南</h3>
          <div class="header-actions">
            <button id="share-btn" class="icon-btn-ghost" title="分享"><i class="fas fa-share-alt"></i></button>
            <button id="close-timeline" class="icon-btn-ghost"><i class="fas fa-times"></i></button>
          </div>
        </div>
        <div class="sidebar-scroll">
          <div id="social-recs-section" class="social-recs-section hidden">
            <div class="trending-header" style="margin-bottom: 15px; color: var(--primary); font-weight: 800;">
              <i class="fas fa-fire"></i>
              <span>社交平台热门趋势</span>
            </div>
            <div id="social-recs-list" class="social-recs-list"></div>
          </div>
          <div class="timeline" id="timeline-content"></div>
        </div>
      </aside>
    </div>

    <!-- Modals -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-key"></i> 秘钥配置</h3>
          <button id="close-settings" class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="input-group">
            <label>Google Gemini API Key (可选)</label>
            <p style="font-size:11px; color:#64748b; margin-bottom:4px;">如需覆盖默认 Key</p>
            <input type="password" id="gemini-key-input" placeholder="AI_KEY...">
          </div>
          <div class="input-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="deepseek-key-input" placeholder="sk-...">
          </div>
          <div class="input-group">
            <label>智谱 AI API Key</label>
            <input type="password" id="zhipu-key-input" placeholder="api-key...">
          </div>
          <div class="input-group">
            <label>天地图 API Key (tk)</label>
            <input type="text" id="tdt-key-input" placeholder="请输入 tk...">
          </div>
          <button id="save-settings" class="primary-btn-full">保存配置</button>
        </div>
      </div>
    </div>

    <div id="history-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-history"></i> 历史指南记录</h3>
          <button id="close-history" class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body" style="padding: 15px; max-height: 70vh; overflow-y: auto;" id="history-list">
          <!-- 历史列表将渲染在这里 -->
        </div>
      </div>
    </div>

    <div id="share-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>行程海报生成</h3>
          <button id="close-share" class="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="poster-preview-area" style="background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center;">
            <div id="poster-placeholder">
              <button id="generate-poster-btn" class="primary-btn-small">生成 AI 海报</button>
            </div>
            <div id="poster-result" class="hidden">
              <canvas id="poster-canvas" width="800" style="max-width: 100%; border-radius: 8px;"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="spinner" class="hidden spinner">
      <div class="loading-animation"></div>
      <div class="loading-text">正在深度规划您的完美行程...</div>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
